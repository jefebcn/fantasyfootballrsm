<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Fantatitano</title>
  <meta name="description" content="Fantatitano, il gioco del Campionato Sammarinese — Voto Titano, senza pagelle.">
  <!-- La scheda che compare sotto il link su WhatsApp e Telegram: ogni invito
       a una lega passa da li', e senza questi tag arrivava nudo. L'immagine
       vuole l'indirizzo intero (i lettori delle anteprime non risolvono i
       percorsi relativi); si rifa' con scripts/anteprima-link.cjs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fantatitano">
  <meta property="og:locale" content="it_IT">
  <meta property="og:url" content="https://fantatitano.site/">
  <meta property="og:title" content="Fantatitano — il fantacalcio del Campionato Sammarinese">
  <meta property="og:description" content="Voto Titano: i voti nascono dal referto dell'arbitro, non dal giudizio di un giornalista. Crea una lega con gli amici o entra in una aperta.">
  <meta property="og:image" content="https://fantatitano.site/media/anteprima.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Il marchio di Fantatitano: il fantacalcio del Campionato Sammarinese">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1B84C6">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black" e non "black-translucent", e la ragione e' misurata, non estetica.
       Con black-translucent la pagina disegna anche sotto l'orologio, ma iOS in
       cambio le da' un viewport alto 793 su uno schermo da 852: svh 793, lvh 852,
       tacca in alto 59. I 59pt che mancano si accumulano tutti IN FONDO, e li'
       la pagina non puo' disegnare niente — le scritte della barra in basso
       finivano dentro quel pezzo e sparivano.
       Con "black" la web view parte sotto la barra di stato: 793pt da y=59 a
       y=852. La barra in basso arriva al bordo vero, la tacca in alto vale 0 e
       l'intestazione blu passa da 124 a 64pt. Il prezzo e' che la striscia
       dell'orologio non e' piu' blu: e' una fascia scura con il testo bianco,
       che resta leggibile sia in tema chiaro sia in scuro.
       Per tornare indietro basta rimettere "black-translucent" qui. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fantatitano">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="media/font/lato-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="media/font/lato-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/font.css">
  <link rel="stylesheet" href="design/tokens/tokens.css">
  <link rel="stylesheet" href="styles/logo.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="sheet-scrim" class="sheet-scrim"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript><p style="padding:24px;font-family:system-ui">L'app ha bisogno di JavaScript.</p></noscript>
  <!-- Se l'app non parte, si ripara da sola.
       Un modulo che non si collega agli altri (file di due versioni diverse in
       cache) ferma tutto prima che app.js scriva una riga: restava lo schermo
       bianco e l'unico rimedio era disinstallarla. Qui fuori dai moduli si
       vede: con un errore si buttano service worker e cache e si ricarica, una
       volta ogni dieci minuti al massimo, cosi' non puo' girare in tondo; se
       non basta, o se dopo 15 secondi non e' partita, c'e' un bottone. -->
  <script>
  (function () {
    var fatto = false;
    function ripara() {
      try { localStorage.setItem('fcs:riparata', String(Date.now())); } catch (e) { /* niente */ }
      var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rr) { return Promise.all(rr.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
      var cc = window.caches ? caches.keys().then(function (kk) { return Promise.all(kk.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
      Promise.all([sw, cc]).catch(function () { /* si ricarica comunque */ }).then(function () { location.reload(); });
    }
    function controlla(errore) {
      if (window.__fcsPartita || fatto) return;
      var ultima = 0;
      try { ultima = Number(localStorage.getItem('fcs:riparata')) || 0; } catch (e) { /* niente */ }
      if (errore && navigator.onLine !== false && Date.now() - ultima > 10 * 60 * 1000) { fatto = true; ripara(); return; }
      fatto = true;
      var a = document.getElementById('app');
      a.innerHTML = '<div style="padding:48px 24px;text-align:center;font-family:system-ui,sans-serif">'
        + '<p style="font-size:18px;font-weight:700;margin:0 0 8px">L\'app non si \u00e8 avviata</p>'
        + '<p style="opacity:.75;margin:0 0 20px">' + (navigator.onLine === false ? 'Sei senza rete: collegati e riprova.' : 'Di solito basta ripararla: non perdi niente, i tuoi dati stanno sul server.') + '</p>'
        + '<button id="ripara-app" type="button" style="font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;background:#0e5e93;color:#fff">Ripara l\'app</button></div>';
      document.getElementById('ripara-app').onclick = ripara;
    }
    window.addEventListener('error', function (e) {
      // solo errori dei nostri file: quelli delle estensioni del browser no
      if (e && e.filename && e.filename.indexOf(location.origin) !== 0) return;
      setTimeout(function () { controlla(true); }, 3000);
    });
    setTimeout(function () { controlla(false); }, 15000);
  })();
  </script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
