      Un solo file, non sei sotto-composizioni: la corona dell'angolo, la linea
      oro e il telefono attraversano piu' scene con passaggi di testimone, e il
      timeline di una sotto-composizione non puo' muovere elementi dell'altra.
      Tutto il movimento sta su un timeline in tempo globale (secondi del video).
      Regia e scene: BRIEF.md, STORYBOARD.md; look: frame.md; bozzetti: storyboard.html.

    <script>
      // ---- misure (in px dello schermo del telefono: 592 di larghezza = 1170 della cattura)
      const K = 592 / 1170;
      // i posti della cattura 04 (campo pieno), in px della cattura: x, y, w, h
      const POSTI = [
        [92, 1055, 222, 209], [347, 1055, 222, 209], [601, 1055, 222, 209], [856, 1055, 222, 209],
        [92, 1451, 222, 209], [347, 1451, 222, 209], [601, 1451, 222, 209], [856, 1451, 222, 209],
        [262, 1846, 222, 209], [686, 1846, 222, 209],
      ];
      const slots = document.getElementById("slots");
      POSTI.forEach(([x, y, w, h], i) => {
        const win = document.createElement("div");
        win.className = "slotwin";
        win.id = "posto-" + (i + 1);
        // i personaggi sporgono sopra il riquadro del posto con la testa: la finestra parte 120px piu' in alto
        const L = (x - 19) * K, T = (y - 120) * K, W = (w + 38) * K, H = (h + 124) * K;
        Object.assign(win.style, { left: L + "px", top: T + "px", width: W + "px", height: H + "px" });
        const img = document.createElement("img");
        img.src = "assets/app/04-campo-pieno.png";
        img.alt = "";
        img.setAttribute("data-layout-allow-overflow", "");
        Object.assign(img.style, { left: -L + "px", top: -T + "px" });
        win.appendChild(img);
        slots.appendChild(win);
      });
      // i tocchi: centro (cx, cy) in px della cattura, diametro in px dello schermo
      const TOCCHI = { "tap-modulo": [997, 369, 64], "tap-piu": [585, 760, 46], "tap-nome": [585, 2072, 46], "tap-conferma": [585, 2019, 64] };
      Object.entries(TOCCHI).forEach(([id, [cx, cy, d]]) => {
        Object.assign(document.getElementById(id).style, { left: cx * K - d / 2 + "px", top: cy * K - d / 2 + "px", width: d + "px", height: d + "px" });
      });

      // ---- il timeline
      const tl = gsap.timeline({ paused: true });
      const SORPASSO = "back.out(1.2)"; // arresto netto con ~6% di sorpasso (frame.md, Motion)
      const IN = 8 / 30; // 8 fotogrammi
      const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };

      // fondo che respira: 100%→104% su 2 s, avanti e indietro, fino a 16 s; poi fermo
      tl.fromTo("#glow", { scale: 1 }, { scale: 1.04, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);

      // corona: nell'angolo (x 48, y 270, 64px, 85%) fino a 14,75 s
      const CS = 64 / 360;
      tl.fromTo("#corona", { x: 80 - 540, y: 297.8 - 636, scale: CS, opacity: 0.85 },
        { x: 80 - 540, y: 297.8 - 636, scale: CS, opacity: 0.85, duration: 0.01 }, 0);

      // ===== 01 · IL TAGLIO (0–3 s)
      tl.fromTo("#s1-k2", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      // il fendente: 1,0 s, 0,2 s, da sinistra-basso a destra-alto
      // la spada: centro da (-500, 1090) a (1600, 870) in 0,3 s, lineare; la punta passa a meta' schermo a ~1,0 s.
      // Due copie in ritardo (0,025 e 0,05 s) fanno la scia di velocita'.
      const SP = { x0: -700 - 570, y0: 1112 - 90 - 22, x1: 1800 - 570, y1: 846 - 90 - 22 };
      [["#spada", 0, 1], ["#spada-g1", 0.03, 0.35], ["#spada-g2", 0.06, 0.15]].forEach(([id, ritardo, op]) => {
        tl.fromTo(id, { x: SP.x0, y: SP.y0, rotation: -12, opacity: op },
          { x: SP.x1, y: SP.y1, rotation: -2, duration: 0.42, ease: "none" }, 0.887 + ritardo);
      });
      // la scia: si disegna mentre la punta attraversa lo schermo (da x -43 a x 1123)
      tl.fromTo("#oro", { rotation: -6.07, scaleX: 0, x: 0, y: 0 }, { scaleX: 1, duration: 0.196, ease: "none" }, 0.902);
      // il lampo dell'impatto
      tl.fromTo("#lampo", { scale: 0, opacity: 1 }, { scale: 1.4, opacity: 0, duration: 0.22, ease: "power2.out" }, 1.0);
      // SERIE A si spacca lungo la linea
      tl.fromTo("#s1-su", { x: 0, y: 0, opacity: 1 }, { x: -6, y: -20, duration: 0.25, ease: "power3.out" }, 1.05);
      tl.fromTo("#s1-giu", { x: 0, y: 0, opacity: 1 }, { x: 6, y: 20, duration: 0.25, ease: "power3.out" }, 1.05);
      // scossa: 3 scosse in 0,15 s, ±6px, deterministica
      [0, 1, 2, 3].forEach((k) => {
        const t = 1.0 + k / 30;
        tl.set("#s1-cam", { x: (hash(k * 13) * 2 - 1) * 6, y: (hash(k * 29 + 5) * 2 - 1) * 6 }, t);
      });
      tl.set("#s1-cam", { x: 0, y: 0 }, 1.15);
      // spinta al 108% e ritorno
      tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", immediateRender: false }, 1.0);
      tl.to("#s1-cam", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 1.1);
      // 1,5 s: FANTACALCIO? diventa NON SOLO
      tl.set("#s1-k1", { opacity: 0 }, 1.5);
      tl.fromTo("#s1-k2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: IN, ease: SORPASSO, immediateRender: false }, 1.5);
      // i pezzi si spengono al 40%
      tl.to(["#s1-su", "#s1-giu"], { opacity: 0.4, duration: 1.0, ease: "power2.out" }, 1.4);
      // uscita: pezzi via, NON SOLO esce in alto
      tl.to(["#s1-su", "#s1-giu"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 2.6);
      tl.to("#s1-k2", { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.6);

      // ===== la linea oro diventa la sottolineatura di FANTACALCIO (testimone)
      // sottolineatura: larga 928px (FANTACALCIO a 150px), centrata, a y 1020
      tl.to("#oro", { rotation: 0, scaleX: 928 / 1180, x: 126, y: 40, duration: 0.5, ease: "power3.inOut" }, 2.6);
      tl.to("#oro", { scaleX: 0, x: 590, duration: 0.25, ease: "power2.in" }, 4.3);

      // ===== 02 · IL LANCIO (3–6 s)
      tl.fromTo("#s2-a1", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 3.0);
      tl.fromTo("#s2-a2", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 3.08);
      tl.set(["#s2-a1", "#s2-a2"], { opacity: 0 }, 4.5);
      tl.fromTo("#s2-b1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 4.5);
      tl.fromTo("#s2-b2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 4.56);
      // il titolo si stringe e va via
      tl.to(["#s2-b1", "#s2-b2"], { scale: 0.86, opacity: 0, duration: 0.25, ease: "power2.in" }, 5.75);
      // la pastiglia: pop a 5,5 s, poi sale sopra il telefono (testimone)
      tl.fromTo("#pill-ft", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: SORPASSO }, 5.5);
      tl.fromTo("#pill-ft-box", { y: 0 }, { y: 275 - 1069, duration: 0.45, ease: "power3.inOut" }, 5.85);

      // ===== 03 · IL TELEFONO (6–8 s)
      tl.fromTo("#phone", { x: 0, y: 1100, scale: 1, filter: "brightness(1)" }, { y: 0, duration: 0.35, ease: SORPASSO }, 6.0);
      tl.fromTo("#s3-r1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 6.5);
      tl.fromTo("#s3-r2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 6.56);
      // schermi: 01 visibile, gli altri spenti
      tl.set(["#scr-02", "#scr-03", "#slots", "#scr-05", "#press"], { opacity: 0 }, 6.0);
      tl.set(".slotwin", { scale: 0 }, 6.0);
      tl.set(".tocco", { opacity: 0, scale: 0.6 }, 6.0);
      const tocca = (id, t) => {
        tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
        tl.to(id, { scale: 1.35, opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.12);
      };
      tocca("#tap-modulo", 7.0);

      // ===== 04 · IL CAMPO SI RIEMPIE (8–12 s): dentro lo schermo al 170%
      // con l'origine in alto a sinistra: lo schermo va a x 37, y -292, largo 1006px
      tl.set("#phone", { x: -216.8, y: -1015.8, scale: 1.7 }, 8.0);
      tocca("#tap-piu", 8.2);
      tl.set("#scr-02", { opacity: 1 }, 8.5);
      tocca("#tap-nome", 8.7);
      tl.set(["#scr-01", "#scr-02"], { opacity: 0 }, 9.0);
      tl.set(["#scr-03", "#slots"], { opacity: 1 }, 9.0);
      // gli altri dieci, uno ogni mezzo battito, con un pop di 6 fotogrammi
      for (let i = 0; i < 10; i++) {
        tl.fromTo("#posto-" + (i + 1), { scale: 0 }, { scale: 1, duration: 0.2, ease: SORPASSO, immediateRender: false }, 9.25 + i * 0.25);
      }
      // si esce dallo schermo verso il telefono intero (posizione della scena 5)
      tl.to("#phone", { x: 0, y: 324 - 700, scale: 1, duration: 0.25, ease: "power3.inOut" }, 11.75);

      // ===== 05 · SALVATA (12–15 s)
      tl.set(["#scr-03", "#slots"], { opacity: 0 }, 12.0);
      tl.set("#scr-05", { opacity: 1 }, 12.0);
      tocca("#tap-conferma", 12.5);
      tl.fromTo("#press", { opacity: 0 }, { opacity: 0.35, duration: 0.06, immediateRender: false }, 12.5);
      tl.to("#press", { opacity: 0, duration: 0.2, ease: "power2.out" }, 12.6);
      // spinta al 108% intorno al pulsante e il telefono si scurisce
      tl.to("#phone", { x: -24.8, y: -459.8, scale: 1.08, duration: 0.12, ease: "power2.out" }, 12.5);
      tl.to("#phone", { filter: "brightness(0.42)", duration: 0.3, ease: "power2.out" }, 12.6);
      tl.fromTo("#s5-check", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: SORPASSO }, 12.6);
      tl.fromTo("#s5-r1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 12.7);
      tl.fromTo("#s5-r2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 12.76);
      // uscita: la scritta sale e sparisce, il telefono scende e si rimpicciolisce
      tl.to(["#s5-check", "#s5-r1", "#s5-r2"], { y: -70, opacity: 0, duration: 0.3, ease: "power2.in" }, 14.5);
      tl.to("#phone", { x: 100, y: 200, scale: 0.7, opacity: 0, duration: 0.45, ease: "power2.in" }, 14.5);

      // ===== 06 · MARCHIO E SITO (15–20 s)
      // la corona scende dall'angolo e cresce al centro (lento-veloce-lento)
      tl.to("#corona", { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.inOut" }, 14.75);
      tl.fromTo("#s6-nome", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 15.5);
      tl.fromTo("#s6-eti", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: IN, ease: SORPASSO }, 16.0);
      tl.fromTo("#s6-sito", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: SORPASSO }, 16.5);
      // da 17,0 s tutto fermo: il respiro del fondo e' gia' finito a 16 s

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
