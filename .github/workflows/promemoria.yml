# Chiama la funzione che spedisce il promemoria della formazione.
#
# Gira ogni ora e non a un'ora fissa perche' le giornate del campionato non
# cadono sempre nello stesso giorno: e' la funzione a decidere se e' il momento,
# guardando quanto manca al lock. Quasi sempre risponde "non e' il momento" e
# non spedisce niente.
#
# "Ogni ora" e' un desiderio, non una promessa: GitHub ritarda e salta le corse
# pianificate quando la piattaforma e' carica. Misurato su questo repository:
# 3,2 - 6,3 - 5,8 ore fra una corsa e l'altra. Per questo la funzione non si
# affida piu' a una finestra stretta e chiede al database chi ha gia' ricevuto
# l'avviso (migrazione 009): una corsa in ritardo arriva tardi, non a vuoto.
#
# Finche' i due secret non sono configurati il lavoro si ferma dicendolo, invece
# di fallire ogni ora e riempire la casella di posta.
#
# Lo slug della funzione si puo' cambiare con il secret PROMEMORIA_FUNZIONE:
# Supabase lo fissa alla creazione e il campo "Name" del pannello NON lo tocca
# ("your slug and endpoint URL will remain the same"), quindi una funzione
# creata con un nome storto resta a quel nome. Meglio una riga qui che
# ricreare la funzione.

name: Promemoria formazione

on:
  schedule:
    - cron: '7 * * * *'        # ogni ora al minuto 7, per non accodarsi al resto
  workflow_dispatch:

concurrency:
  group: promemoria
  cancel-in-progress: false

jobs:
  avvisa:
    runs-on: ubuntu-latest
    steps:
      - name: Serve la configurazione?
        id: cfg
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          TOKEN: ${{ secrets.PROMEMORIA_TOKEN }}
        run: |
          # Gli spazi intorno a un secret non si vedono da nessuna parte. Nel
          # pannello di GitHub il valore e' mascherato, nel registro esce come
          # *** — e uno spazio davanti all'indirizzo fa morire curl con
          # "URL rejected: Malformed input to a URL function", tre secondi e
          # via, senza dire perche'. E' successo: nel registro si vedeva solo
          # che "URL: ***" aveva uno spazio in piu' di "TOKEN: ***".
          # Ne' un indirizzo ne' un token esadecimale contengono spazi, quindi
          # si toglie tutto quello che e' spazio, ritorno a capo compreso.
          url=$(printf '%s' "$URL" | tr -d '[:space:]')
          token=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$token" ]; then
            echo "pronta=no" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_FUNCTIONS_URL o PROMEMORIA_TOKEN non impostati."
            echo "I passi stanno in supabase/functions/promemoria/README.md."
            exit 0
          fi
          if [ "$url" != "$URL" ] || [ "$token" != "$TOKEN" ]; then
            echo "::warning::Un secret ha spazi o ritorni a capo intorno al valore."
            echo "Li ignoro, ma conviene ripulirli: Settings -> Secrets -> Actions."
          fi
          case "$url" in
            https://*)
              echo "pronta=si" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "pronta=no" >> "$GITHUB_OUTPUT"
              echo "::error::SUPABASE_FUNCTIONS_URL non comincia per https:// —"
              echo "atteso https://<progetto>.supabase.co/functions/v1" ;;
          esac

      - name: Spedisci
        if: steps.cfg.outputs.pronta == 'si'
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          TOKEN: ${{ secrets.PROMEMORIA_TOKEN }}
          FUNZIONE: ${{ secrets.PROMEMORIA_FUNZIONE }}
        run: |
          # Ripulito anche qui: i valori non passano dal passo di sopra, e un
          # output che li portasse in giro finirebbe nel registro.
          url=$(printf '%s' "$URL" | tr -d '[:space:]')
          token=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          nome=$(printf '%s' "${FUNZIONE:-promemoria}" | tr -d '[:space:]')

          # Il corpo va su un file e lo stato in una variabile, invece di
          # prendere tutto da una sostituzione di comando: con --fail-with-body
          # curl usciva male, la sostituzione moriva e la riga che stampava la
          # risposta non veniva mai eseguita. Nel registro restava soltanto
          # "curl: (22) ... error: 401" e il motivo, che la funzione scrive nel
          # corpo, andava perso. E' successo il 17 settembre: sono serviti
          # tentativi a mano per sapere cosa avesse risposto.
          stato=$(curl -sS --max-time 60 -o /tmp/risposta.txt -w '%{http_code}' \
            -H "x-promemoria-token: $token" \
            "${url%/}/$nome") || {
              echo "::error::La funzione non risponde: $url non raggiungibile."
              exit 1
            }
          corpo=$(cat /tmp/risposta.txt)
          echo "HTTP $stato"
          echo "$corpo"

          case "$stato" in
            2*) exit 0 ;;
            401)
              echo "::error::La funzione ha detto no al token."
              echo "PROMEMORIA_TOKEN su GitHub e PROMEMORIA_TOKEN fra i secret"
              echo "di Supabase devono essere lo stesso identico valore."
              echo "Supabase: Project Settings -> Edge Functions -> Secrets."
              echo "Dopo averlo cambiato la funzione va ridistribuita."
              exit 1 ;;
            404)
              echo "::error::Nessuna funzione che si chiami \"$nome\"."
              echo "Lo slug e' quello nell'indirizzo della funzione su Supabase,"
              echo "non il campo Name. Si corregge col secret PROMEMORIA_FUNZIONE."
              exit 1 ;;
            5*)
              echo "::error::La funzione e' partita ed e' andata in errore: vedi sopra."
              exit 1 ;;
            *)
              echo "::error::Risposta inattesa: HTTP $stato."
              exit 1 ;;
          esac
