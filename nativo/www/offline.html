<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantatitano</title>
<!-- L'app iPhone apre fantatitano.site: questa pagina sta DENTRO l'app e si vede solo se il sito non risponde (niente rete). -->
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0a0a0c; color: #fff; font: 16px/1.45 -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 320px; display: grid; gap: 14px; justify-items: center; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #c9c5dc; }
  b { color: #d9f51f; }
  button { margin-top: 6px; border: 0; border-radius: 99px; padding: 12px 26px; font: inherit; font-weight: 700;
    background: #d9f51f; color: #0a0a0c; }
</style>
</head>
<body>
<main>
  <h1><span style="color:#fff">FANTA</span><b>TITANO</b></h1>
  <p>Non riesco a collegarmi. Controlla la connessione e riprova.</p>
  <button onclick="location.replace('https://fantatitano.site/')">Riprova</button>
</main>
</body>
</html>
