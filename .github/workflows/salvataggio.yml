# Copia di sicurezza del database, ogni notte.
#
# È l'unica cosa in questo progetto che non si può rifare. Il codice sta su
# GitHub, le icone si rigenerano da uno script, il campionato si riscarica
# dalla FSGC. Le rose, le formazioni consegnate, i voti, le contestazioni e il
# registro del Giudice Dati esistono in un posto solo: dentro Supabase. Se
# quel progetto si corrompe o viene sospeso, una stagione intera sparisce.
#
# Il dump esce cifrato e viene allegato alla corsa. Non finisce nel repository:
# un dump contiene gli indirizzi e-mail di tutti, e il repository è pubblico.
#
# SERVE UN SECRET, e solo uno:
#   SUPABASE_DB_URL   la stringa di connessione, da Supabase:
#                     Project Settings → Database → Connection string → URI
#                     (quella che comincia per postgresql://postgres...)
# E uno facoltativo ma consigliato:
#   BACKUP_PASSPHRASE una parola d'ordine tua. Se c'è, il dump viene cifrato e
#                     senza quella parola non lo apre nessuno — nemmeno chi
#                     entrasse nel tuo GitHub. Se manca, il lavoro si ferma e
#                     lo dice: un dump con dentro le e-mail di tutti non si
#                     lascia in chiaro.
#
# PER RILEGGERLO. Scarichi l'allegato dalla corsa, poi:
#   gpg --decrypt salvataggio.sql.gpg > salvataggio.sql
#   psql "$DATABASE_URL" -c 'create extension if not exists pgcrypto'
#   psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f salvataggio.sql
#
# La riga di mezzo non è un dettaglio: qui si salva il solo schema public, e
# un dump di un singolo schema NON si porta dietro le estensioni. Senza
# pgcrypto il ripristino muore su gen_random_bytes, che è il valore
# predefinito del codice invito delle leghe. Su un progetto Supabase nuovo
# c'è già; su un Postgres qualunque no.
#
# Il giro intero — dump, cifratura, ripristino e confronto dei dati — lo prova
# supabase/prove/salvataggio.sh su un Postgres vero. È l'unico modo di sapere
# che un salvataggio è un salvataggio: che esca senza errori non vuol dire
# niente, quello che conta è che si riesca a rimetterlo dentro.

name: Salvataggio database

on:
  schedule:
    - cron: '20 3 * * *'      # ogni notte alle 03:20 UTC, quando non gioca nessuno
  workflow_dispatch:

concurrency:
  group: salvataggio
  cancel-in-progress: false

jobs:
  salva:
    runs-on: ubuntu-latest
    steps:
      - name: Serve la configurazione?
        id: cfg
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          PAROLA: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Spazi e ritorni a capo intorno a un secret non si vedono: nel
          # pannello il valore è mascherato e nel registro esce come ***.
          # Ci siamo già persi una notte su uno spazio davanti a un indirizzo.
          url=$(printf '%s' "$DBURL" | tr -d '[:space:]')
          if [ -z "$url" ]; then
            echo "pronta=no" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL non impostato: niente da salvare."
            echo "Project Settings → Database → Connection string → URI."
            exit 0
          fi
          case "$url" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL non è una stringa di connessione Postgres."; exit 1 ;;
          esac
          if [ -z "$(printf '%s' "$PAROLA" | tr -d '[:space:]')" ]; then
            echo "::error::Manca BACKUP_PASSPHRASE. Un dump contiene gli indirizzi"
            echo "::error::e-mail di tutti: non lo salvo in chiaro."
            exit 1
          fi

          # ---- la stringa si guarda PRIMA di usarla.
          #
          # Senza questi controlli l'unica cosa che si vede e' il FATAL di
          # Postgres — "password authentication failed for user postgres" —
          # che e' lo stesso identico messaggio per tre errori diversi: la
          # password sbagliata, l'utente sbagliato e il segnaposto rimasto
          # dentro. E' successo alla prima configurazione, e il registro non
          # aiutava in nessun modo.
          #
          # Nessuno di questi controlli stampa la password: si dice cosa non va
          # e dove si rimedia. L'utente e l'indirizzo invece si stampano, e non
          # sono segreti: il codice del progetto sta gia' nel frontend.
          resto=${url#*://}
          cred=${resto%@*}; ospite=${resto##*@}
          utente=${cred%%:*}; parola=${cred#*:}
          host=${ospite%%[:/]*}; porta=${ospite##*:}; porta=${porta%%/*}
          echo "utente: $utente"
          echo "server: $host:$porta"

          case "$parola" in
            ''|"$utente") echo "::error::Nella stringa manca la password: c'e' solo l'utente."; exit 1 ;;
            *'[YOUR-PASSWORD]'*|*'['*|*']'*)
              echo "::error::Nella stringa sono rimaste le parentesi quadre: erano il segnaposto."
              echo "::error::Va sostituito TUTTO [YOUR-PASSWORD], parentesi comprese, con la password."
              exit 1 ;;
          esac

          # Il pooler vuole l'utente col codice del progetto attaccato. Con
          # "postgres" e basta risponde password sbagliata, che manda a
          # cercare il guasto dalla parte sbagliata.
          case "$host" in
            *pooler.supabase.com)
              case "$utente" in
                postgres.*) ;;
                *) echo "::error::Col pooler l'utente e' postgres.<codice-progetto>, non $utente."
                   echo "::error::Ricopia la riga intera da Supabase → Connect → Session pooler."
                   exit 1 ;;
              esac
              if [ "$porta" = "6543" ]; then
                echo "::error::La porta 6543 e' il pooler a transazioni: pg_dump non ci lavora."
                echo "::error::Serve il Session pooler, porta 5432."
                exit 1
              fi ;;
          esac

          # Caratteri che in un indirizzo vogliono dire altro: ? apre i
          # parametri, @ separa host e credenziali, / chiude l'autorita'.
          # In una password vanno scritti codificati (?=%3F, @=%40, /=%2F,
          # #=%23, %=%25) oppure, molto meglio, si sceglie una password di
          # sole lettere e numeri.
          case "$parola" in
            *'?'*|*'@'*|*'/'*|*'#'*|*' '*)
              echo "::error::La password dentro la stringa contiene un carattere che va codificato"
              echo "::error::(? @ / # o uno spazio). O la codifichi, o — piu' semplice — la rifai"
              echo "::error::di sole lettere e numeri: Project Settings → Database → Reset database password."
              exit 1 ;;
          esac

          echo "pronta=si" >> "$GITHUB_OUTPUT"

      # Il client di sistema è più vecchio del server di Supabase, e pg_dump si
      # rifiuta di lavorare su un server più nuovo di sé: "server version
      # mismatch". Quindi si installa quello ufficiale.
      - name: pg_dump aggiornato
        if: steps.cfg.outputs.pronta == 'si'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump e cifratura
        if: steps.cfg.outputs.pronta == 'si'
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          PAROLA: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          url=$(printf '%s' "$DBURL" | tr -d '[:space:]')
          # --no-owner e --no-acl: i ruoli di Supabase non esistono altrove, e
          # senza queste il ripristino su un altro progetto si pianta sulla
          # prima riga. Solo lo schema public: auth e storage li ricrea Supabase.
          /usr/lib/postgresql/17/bin/pg_dump "$url" \
            --schema=public --no-owner --no-acl --format=plain \
            > salvataggio.sql
          # pg_dump di uno schema mette in cima "CREATE SCHEMA public", ma il
          # public esiste già in ogni database Postgres e in ogni progetto
          # Supabase appena creato: al ripristino quella riga ferma tutto con
          # "schema public already exists". Si toglie qui, non al ripristino,
          # perché il giorno in cui serve un backup nessuno ha voglia di
          # scoprire che va modificato a mano.
          sed -i '/^CREATE SCHEMA public;$/d; /^COMMENT ON SCHEMA public/d' salvataggio.sql
          righe=$(wc -l < salvataggio.sql)
          echo "dump: $righe righe, $(du -h salvataggio.sql | cut -f1)"
          # Un dump vuoto è un guasto, non un salvataggio: meglio accorgersene
          # adesso che il giorno in cui serve.
          if [ "$righe" -lt 50 ] || ! grep -q "CREATE TABLE" salvataggio.sql; then
            echo "::error::Il dump non contiene tabelle: non lo tengo buono."
            exit 1
          fi
          for t in profiles leagues league_members rosters lineups; do
            grep -q "public\.$t" salvataggio.sql || { echo "::error::manca la tabella $t"; exit 1; }
          done
          printf '%s' "$PAROLA" | tr -d '[:space:]' > /tmp/parola
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-file /tmp/parola --output salvataggio.sql.gpg salvataggio.sql
          rm -f /tmp/parola salvataggio.sql
          echo "cifrato: $(du -h salvataggio.sql.gpg | cut -f1)"

      - name: Allega la copia
        if: steps.cfg.outputs.pronta == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: salvataggio-${{ github.run_id }}
          path: salvataggio.sql.gpg
          retention-days: 90
          if-no-files-found: error
