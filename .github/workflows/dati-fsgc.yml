# Importa da sola i dati del campionato, invece di dipendere da qualcuno che si
# ricordi di lanciare due script ogni settimana.
#
# Se salta una settimana i voti non arrivano, e la giornata si congela martedi'
# alle 20:00 comunque (art. 9.2): il dato mancante non e' piu' rettificabile.
# Per questo gira di continuo e non solo il lunedi': se la FSGC pubblica in
# ritardo, il giro dopo si riprende senza che nessuno debba accorgersene.
#
# Non committa se non e' cambiato niente, quindi girare a vuoto non costa nulla.

name: Dati FSGC

# GitHub non fa partire i lavori pianificati all'ora scritta: li mette in coda
# e li serve quando ha macchine libere. Su questo repository il cron delle
# 05:30 e' partito alle 09:55, alle 10:09, alle 10:06 — quattro ore e mezza
# dopo, tutte le volte. Risultato: le partite del venerdi' sera si vedevano
# nell'app il sabato a mezzogiorno, e uno che apre l'app la mattina non trova
# niente. Un solo appuntamento al giorno, per giunta spostato, non regge.
#
# Quindi si prova ogni due ore. Girare a vuoto non costa: se la FSGC non ha
# pubblicato niente di nuovo il lavoro non committa e finisce in un minuto, e
# su un repository pubblico i minuti di Actions non si pagano.
#
# E NON BASTA: "ogni due ore" e' diventato una corsa ogni 5-6 ore (misurato
# il 29-30 settembre). Farlo partire da fuori (supabase/dati-fsgc-pianificato.sql,
# pronto ma NON attivo) vuole un token di GitHub, e Alex ha deciso di
# rimandare (30 settembre).
#
# Il rimedio senza token: un lavoro di GitHub puo' restare acceso sei ore.
# Nei giorni di partita (da un'ora prima del primo calcio d'inizio a due giorni
# dopo l'ultima gara della giornata, scripts/finestra-partite.mjs) l'import non
# fa un giro e basta: resta acceso 5h20m e ricontrolla la FSGC ogni 20 minuti.
# Intanto la corsa successiva aspetta in coda (concurrency qui sotto) e parte
# appena questa finisce, quindi i ritardi di GitHub non lasciano buchi.
# Gli altri giorni il giro e' uno, come prima.
#
# Il tasto workflow_dispatch qui sotto NON va tolto: fa partire l'import
# subito, a mano, e serve all'orologio del database il giorno che si accende.
on:
  schedule:
    - cron: '7 */2 * * *'      # ogni due ore (GitHub la servira' quando puo')
  workflow_dispatch:           # e a mano, dal tasto "Run workflow"

concurrency:
  group: dati-fsgc
  cancel-in-progress: false    # due import sovrapposti si pesterebbero i piedi

permissions:
  contents: write

jobs:
  importa:
    runs-on: ubuntu-latest
    # 5h50m: il turno ne usa 5h20m, poi un ultimo giro e il push. Sotto le sei
    # ore di GitHub, e sotto le otto della sentinella (controlla-import.sh),
    # che un turno piantato lo vede come vecchio e suona.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # importa-fsgc.py legge le pagine della FSGC con BeautifulSoup e chiede
      # il parser 'lxml', che e' un pacchetto a parte. Senza questo passo il
      # lavoro moriva sempre alla prima riga utile — ModuleNotFoundError: bs4 —
      # e il campionato non si e' mai importato da solo nemmeno una volta.
      # Le versioni sono fissate: un import che va a prendere le pagine di un
      # sito che non controlliamo ha gia' abbastanza modi per rompersi.
      - name: Le librerie che servono a Python
        run: python3 -m pip install --quiet 'beautifulsoup4==4.15.0' 'lxml==6.1.3'

      # node_modules e package-lock.json non sono versionati (lo dice
      # .gitignore: servono a rigenerare vendor/ e a far girare eslint, non
      # finiscono nel sito). Quindi vanno installati qui, se no `npm test` piu'
      # sotto non trova eslint. Non si vedeva perche' quel passo gira solo
      # quando l'import trova dati nuovi, e l'import non e' mai arrivato in
      # fondo: un secondo guasto in fila al primo.
      - name: Le librerie che servono a Node
        run: npm install --no-audit --no-fund

      # data/tabellini.json e' l'archivio che permette allo script di riprendere
      # da dove era: non e' versionato (a meta' non vale niente) e senza di lui
      # ogni esecuzione riscaricherebbe da zero tutte le partite giocate — a
      # fine stagione duecentoquaranta. Qui si conserva tra un giro e l'altro.
      - name: Riprendi l'archivio dei tabellini
        uses: actions/cache@v4
        with:
          path: data/tabellini.json
          key: tabellini-${{ github.run_id }}
          restore-keys: |
            tabellini-

      # Calendario, risultati, referti e highlights, poi service worker nuovo,
      # calendario dei lock, prove, commit e push se ci sono dati nuovi: tutto
      # dentro scripts/importa-in-giro.sh, che nei giorni di partita resta
      # acceso e ricontrolla la FSGC ogni 20 minuti (lo spiega lui, in cima).
      # Se la FSGC non risponde al primo giro esce con errore: e' voluto, un
      # fallimento visibile e' meglio di dati vecchi spacciati per nuovi.
      - name: Importa, e nei giorni di partita resta di guardia
        run: |
          git config user.name  'importatore FSGC'
          git config user.email 'importatore-fsgc@users.noreply.github.com'
          bash scripts/importa-in-giro.sh
