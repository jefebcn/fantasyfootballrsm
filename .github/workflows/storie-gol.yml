# Le storie Instagram dei gol, mentre si gioca.
#
# scripts/gol-in-diretta.py guarda ogni minuto le partite in corso sulla FSGC
# e a ogni gol fa la storia; scripts/pubblica-storia.mjs la mette su Instagram.
# Con --avvisa il gol diventa anche una notifica per chi ha il marcatore fra
# i titolari (052): parte anche quando STORIE_GOL e' in prova, non se e' «off».
#
# L'INTERRUTTORE e' la variabile del repository STORIE_GOL (Settings → Secrets
# and variables → Actions → Variables):
#   on     pubblica davvero
#   off    il lavoro non parte neanche
#   altro  (o non impostata) prova: le storie si fanno e restano negli
#          artefatti del lavoro, su Instagram non va niente
#
# L'OROLOGIO (20/11, Alex: «quasi istantaneo»): ogni 2 minuti pg_cron chiama
# la funzione Supabase orologio-gol, che fa partire SUBITO questo lavoro
# (workflow_dispatch) se c'e' una partita fra meno di 30 minuti o in corso e
# nessun turno sta girando. Le corse pianificate qui sotto restano come riserva.
# Durante il turno le pagine delle partite si leggono ogni 30 secondi.
#
# IL TURNO SEGUE LE PARTITE (scripts/turno-gol.mjs, 15/11): da mezz'ora prima
# del calcio d'inizio a 3h30 dopo, al massimo 5h20 per turno. GitHub fa partire
# i lavori pianificati con ore di ritardo (l'8/11 dalle 12:01 alle 15:33 non
# guardava nessuno): quindi si prova ogni ora (fuori dalle partite il lavoro
# dura pochi secondi) e, se a fine turno le partite continuano, il turno fa
# partire SUBITO quello dopo con workflow_dispatch, senza aspettare l'orario.

name: Storie dei gol

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: storie-gol
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # per far partire il turno dopo (workflow_dispatch)

jobs:
  diretta:
    if: vars.STORIE_GOL != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Si gioca?
        id: finestra
        run: node scripts/turno-gol.mjs inizio | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.finestra.outputs.si == 'si'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.finestra.outputs.si == 'si'
        with:
          node-version: '22'

      - name: Le librerie
        if: steps.finestra.outputs.si == 'si'
        run: |
          python3 -m pip install --quiet 'beautifulsoup4==4.15.0' 'lxml==6.1.3'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Quali gol hanno gia' la loro storia: il turno prima lo sa, questo no.
      # (Il database lo sa comunque, storie_pubblicate, e non ripubblica.)
      # In ritenta/ le storie che Instagram ha rifiutato: si riprovano qui.
      - name: Riprendi lo stato
        if: steps.finestra.outputs.si == 'si'
        uses: actions/cache@v4
        with:
          path: |
            diretta/stato.json
            diretta/ritenta
          key: storie-gol-${{ github.run_id }}
          restore-keys: |
            storie-gol-

      - name: Gol in diretta
        if: steps.finestra.outputs.si == 'si'
        env:
          STORIE_GOL: ${{ vars.STORIE_GOL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # la notifica «Gol di X!» a chi ha il marcatore in formazione (052):
          # la spedisce la funzione del promemoria, con gli stessi secret
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          PROMEMORIA_TOKEN: ${{ secrets.PROMEMORIA_TOKEN }}
          PROMEMORIA_FUNZIONE: ${{ secrets.PROMEMORIA_FUNZIONE }}
        run: python3 scripts/gol-in-diretta.py --uscita diretta --dati-db --pubblica --avvisa --foto --anche-vecchi --ogni 30 --per ${{ steps.finestra.outputs.per }}

      - name: Le storie fatte
        if: always() && steps.finestra.outputs.si == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: storie-${{ github.run_id }}
          path: diretta/*.jpg
          if-no-files-found: ignore
          retention-days: 14

      # Le partite vanno avanti oltre il tempo di questo turno, o ne comincia
      # un'altra fra poco: parte subito il turno dopo (resta in coda a questo).
      - name: Il turno dopo
        if: always() && steps.finestra.outputs.si == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node scripts/turno-gol.mjs catena ${{ steps.finestra.outputs.inizio }} ${{ steps.finestra.outputs.per }} ${{ steps.finestra.outputs.fine }})" = si ]; then
            gh workflow run storie-gol.yml --ref "${{ github.ref_name }}" && echo "turno dopo fatto partire"
          else
            echo "niente turno dopo: partite finite, il prossimo blocco lo prende il turno orario"
          fi
