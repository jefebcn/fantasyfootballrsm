    <!--
      Versione 2 (nota di Alex dopo la prima consegna: "troppo tempo morto, deve essere un
      continuo di animazioni, ganci; e' anche troppo spoglio, e' un'inserzione per Instagram").
      Regola della v2: ogni mezzo secondo succede qualcosa, e niente sta mai fermo del tutto
      (fondo con raggi e polvere oro, spinte lente della camera, giocatori che ondeggiano).

      Un solo file, non sotto-composizioni: la corona dell'angolo, la linea oro, la pastiglia e
      il telefono attraversano piu' scene con passaggi di testimone, e il timeline di una
      sotto-composizione non puo' muovere elementi dell'altra. Tutto il movimento sta su un
      timeline in tempo globale (secondi del video). Regia: BRIEF.md, STORYBOARD.md; look: frame.md.
    -->

      .fascio { position: absolute; top: -200px; width: 420px; height: 2600px; transform-origin: 50% 0;

      /* il telefono: #phone-mov lo porta dentro e lo fa ondeggiare, #phone fa gli ingressi nello schermo */

      #vs-r2 { top: 456px; }

      #s6-g1 { left: -10px; top: 440px; width: 271px; height: 330px; }
      #s6-g2 { left: 150px; top: 520px; width: 306px; height: 330px; }
      #s6-g3 { left: 628px; top: 515px; width: 307px; height: 340px; }
      #s6-g4 { left: 790px; top: 400px; width: 306px; height: 420px; }

      #s6-sito-box { position: absolute; left: 0; right: 0; top: 1177px; text-align: center; will-change: transform; }
      #s6-sito { background: #FFC94D; color: #0D1733; padding: 26px 56px; box-shadow: 0 16px 50px rgba(255, 201, 77, 0.4); }
      #s6-freccia { position: absolute; left: 495px; top: 1336px; width: 90px; height: 120px; will-change: transform, opacity; }

      /* corona: piccola nell'angolo, grande al centro nella scena 6 (posta nella posizione finale) */
      #corona { position: absolute; left: 360px; top: 480px; width: 360px; height: auto; transform-origin: 50% 50%; will-change: transform;
        filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.25)); }

      /* il lampo bianco dei passaggi */
      #flash { position: absolute; inset: 0; background: #FFF4D6; opacity: 0; will-change: opacity; }

    <script>
      // ---- utilita' deterministiche
      const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
      const tra = (n, a, b) => a + hash(n) * (b - a);

      // ---- le parole che si spezzano in lettere (per gli ingressi "esplosi" e l'onda d'oro)
      document.querySelectorAll("[data-lettere]").forEach((el) => {
        const testo = el.textContent;
        el.textContent = "";
        [...testo].forEach((c) => {
          const s = document.createElement("span");
          s.className = "lettera";
          s.textContent = c === " " ? " " : c;
          el.appendChild(s);
        });
      });

      // ---- polvere d'oro nel fondo: 40 granelli che salgono piano, sempre
      const polvere = document.getElementById("polvere");
      const GRANI = [];
      for (let i = 0; i < 40; i++) {
        const g = document.createElement("div");
        g.className = "granello";
        const d = tra(i * 3 + 1, 3, 9);
        Object.assign(g.style, {
          left: tra(i * 7 + 2, 20, 1060) + "px", top: "0px", width: d + "px", height: d + "px",
          background: hash(i * 11 + 3) < 0.65 ? "#FFC94D" : "#FFF4D6",
          opacity: tra(i * 13 + 4, 0.18, 0.6).toFixed(2),
          boxShadow: d > 6 ? "0 0 10px rgba(255, 201, 77, 0.6)" : "none",
        });
        polvere.appendChild(g);
        GRANI.push(g);
      }

      // ---- misure del telefono (px dello schermo: 592 di larghezza = 1170 della cattura)
      const K = 592 / 1170;
      const POSTI = [
        [92, 1055, 222, 209], [347, 1055, 222, 209], [601, 1055, 222, 209], [856, 1055, 222, 209],
        [92, 1451, 222, 209], [347, 1451, 222, 209], [601, 1451, 222, 209], [856, 1451, 222, 209],
        [262, 1846, 222, 209], [686, 1846, 222, 209],
      ];
      const PORTIERE = [474, 660, 222, 209]; // il portiere della cattura 03, per le sue scintille
      const slots = document.getElementById("slots");
      const stelle = document.getElementById("stelle");
      const CENTRI = [];
      POSTI.forEach(([x, y, w, h], i) => {
        const win = document.createElement("div");
        win.className = "slotwin";
        win.id = "posto-" + (i + 1);
        // i personaggi sporgono sopra il riquadro del posto con la testa: la finestra parte 120px piu' in alto
        const L = (x - 19) * K, T = (y - 120) * K, W = (w + 38) * K, H = (h + 150) * K;
        Object.assign(win.style, { left: L + "px", top: T + "px", width: W + "px", height: H + "px" });
        const img = document.createElement("img");
        img.src = "assets/app/04-campo-pieno.png";
        img.alt = "";
        img.setAttribute("data-layout-allow-overflow", "");
        Object.assign(img.style, { left: -L + "px", top: -T + "px" });
        win.appendChild(img);
        slots.appendChild(win);
        CENTRI.push([(x + w / 2) * K, (y + h * 0.35) * K]);
      });
      CENTRI.unshift([(PORTIERE[0] + PORTIERE[2] / 2) * K, (PORTIERE[1] + PORTIERE[3] * 0.35) * K]);
      // quattro stelle per ogni posto (11 posti: il portiere e' il primo)
      CENTRI.forEach(([cx, cy], i) => {
        for (let k = 0; k < 4; k++) {
          const s = document.createElement("div");
          s.className = "stella" + (k % 2 ? " bianca" : "");
          s.id = `stella-${i}-${k}`;
          Object.assign(s.style, { left: cx + "px", top: cy + "px" });
          stelle.appendChild(s);
        }
      });
      const TOCCHI = { "tap-modulo": [997, 369, 64], "tap-piu": [585, 760, 46], "tap-nome": [585, 2072, 46], "tap-conferma": [585, 2019, 64] };
      Object.entries(TOCCHI).forEach(([id, [cx, cy, d]]) => {
        Object.assign(document.getElementById(id).style, { left: cx * K - d / 2 + "px", top: cy * K - d / 2 + "px", width: d + "px", height: d + "px" });
      });

      // ---- il contatore: un numero per ogni titolare, uno solo acceso alla volta
      const contaNum = document.getElementById("conta-num");
      for (let n = 1; n <= 11; n++) {
        const s = document.createElement("span");
        s.id = "conta-" + n;
        s.textContent = n;
        contaNum.appendChild(s);
      }

      // ---- la pioggia d'oro a campo pieno: 30 stelle
      const pioggia = document.getElementById("pioggia");
      for (let i = 0; i < 30; i++) {
        const s = document.createElement("div");
        s.className = "stella" + (i % 3 === 0 ? " bianca" : "");
        s.id = "goccia-" + i;

      // ---- i coriandoli della conferma: 56 pezzi
      const COLORI = ["#FFC94D", "#4FA5DE", "#FFFFFF", "#3F6ADD", "#FFC94D", "#FFF4D6"];

      // =====================================================================================
      // ---- il timeline
      window.__timelines = window.__timelines || {};

      const SORPASSO = "back.out(1.2)";

      // scossa deterministica di una "camera"
      const scossa = (id, t, amp = 8, colpi = 4) => {
        for (let k = 0; k < colpi; k++) {
          const a = amp * (1 - k / colpi);
          tl.set(id, { x: (hash(t * 31 + k * 13) * 2 - 1) * a, y: (hash(t * 17 + k * 29 + 5) * 2 - 1) * a }, t + k / 30);
        }
        tl.set(id, { x: 0, y: 0 }, t + colpi / 30);

      // una parola che sbatte: arriva grande e trasparente, si ferma con un rimbalzo
      const sbatte = (id, t, da = 1.9) =>
        tl.fromTo(id, { scale: da, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: SBATTE, immediateRender: false }, t);
      // lettere sparse che si ricompongono
      const ricomponi = (sel, t, seme, dur = 0.32) => {

        lettere.forEach((l, i) => {
          tl.fromTo(l, {
            x: tra(seme + i * 3, -320, 320), y: tra(seme + i * 7 + 1, -260, 260), rotation: tra(seme + i * 11 + 2, -70, 70),
            scale: tra(seme + i * 5 + 3, 0.3, 1.8), opacity: 0,
          }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: dur, ease: "back.out(1.6)", immediateRender: false },
          t + Math.abs(i - (lettere.length - 1) / 2) * 0.018);
        });
      };
      // l'onda d'oro che attraversa una parola, lettera per lettera
      const ondaOro = (sel, t, colore = "#FFC94D", base = "#FFFFFF") => {
        gsap.utils.toArray(sel + " .lettera").forEach((l, i) => {
          tl.to(l, { color: colore, y: -14, duration: 0.09, ease: "power2.out" }, t + i * 0.035);
          tl.to(l, { color: base, y: 0, duration: 0.16, ease: "power2.in" }, t + i * 0.035 + 0.09);
        });
      };
      // il riflesso su una pastiglia o una fascia
      const riflesso = (id, t, dur = 0.55) =>
        tl.fromTo(id, { xPercent: -120 }, { xPercent: 320, duration: dur, ease: "power2.inOut", immediateRender: false }, t);

      // ===== il fondo, per tutti i 20 secondi
      tl.fromTo("#glow", { scale: 1 }, { scale: 1.06, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);
      tl.fromTo("#fascio-sx", { rotation: 16 }, { rotation: 30, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);

        const y0 = tra(i * 19 + 7, 0, 1920);

        const deriva = tra(i * 29 + 9, -60, 60);

      const tocca = (id, t) => {

      tl.to("#phone", { x: -216.8, y: -1015.8, scale: 1.7, duration: 0.32, ease: "power3.inOut" }, 6.42);

      // ===== 04 · IL CAMPO SI RIEMPIE (6,75–10,75 s)
      tocca("#tap-piu", 6.9);

      tocca("#tap-nome", 7.42);
      tl.set(["#scr-01", "#scr-02"], { opacity: 0 }, 7.7);
      tl.set(["#scr-03", "#slots"], { opacity: 1 }, 7.7);
      // la camera continua a spingere piano verso il centro del campo
      tl.to("#phone", { x: -229.2, y: -1045.9, scale: 1.74, duration: 2.6, ease: "none" }, 7.75);
      // le scintille di un posto
      const scintille = (i, t) => {

          const a = (k / 4) * Math.PI * 2 + 0.6 + i;
